name: CI
run-name: CI 🔍 ${{ github.event.pull_request.title }}

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        dotnet-version: [8, 9, 10]
        project: ['./src/IdentityServer', './src/Server']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Build projects
        shell: bash
        working-directory: ${{ matrix.project }}
        run: dotnet build ./all.csproj

      - name: Run tests
        shell: bash
        working-directory: ${{ matrix.project }}
        run: dotnet test ./all.csproj /p:BuildTestsOnly=true --no-build

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          check-latest: true
          node-version-file: 'src/UI/package.json'
          cache: 'yarn'
          cache-dependency-path: 'src/UI/yarn.lock'

      - name: Build UI
        shell: bash
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          yarn config set strict-ssl false
          yarn --cwd src/UI
          yarn --cwd src/UI build
